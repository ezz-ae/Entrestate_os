name: Manual Smoke Run

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL (include https://). Defaults to Terminal production."
        required: false
        # terminal.entrestate.com, not entrestate.com: scripts/smoke.sh exercises
        # /api/chat and /api/market-score/summary, which are Terminal routes. The
        # old default aimed this suite at the business platform, where both 404.
        default: "https://terminal.entrestate.com"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run smoke suite
        env:
          BASE_URL: ${{ inputs.base_url || 'https://terminal.entrestate.com' }}
          BYPASS_HEADER: x-vercel-protection-bypass
          BYPASS_TOKEN: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: bash scripts/smoke.sh
