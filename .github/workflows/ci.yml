name: Entrestate OS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Guardian
        run: pnpm run guardian
        
      - name: Lint
        run: pnpm run lint
        
      - name: Run Unit Tests
        run: pnpm run test
        
      - name: Run Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_VERCEL_ENV: production
          SKIP_ENV_VALIDATION: true
